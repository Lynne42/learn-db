services:
  mysql-learn:
    image: mysql:8.4
    container_name: mysql-learn
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: order_system
      TZ: Asia/Shanghai
    ports:
      - "13306:3306"
    volumes:
      # 将本地的自定义配置文件，挂载到 MySQL 容器内部的配置合并目录
      - ./my_template.cnf:/etc/mysql/conf.d/my_custom.cnf:ro
      # 持久化数据目录
      - ./data/mysql:/var/lib/mysql
    command: 
      - --character-set-server=utf8mb4  # 字符集规则， 必须设置
      - --innodb-buffer-pool-size=512M # 强制限制 InnoDB 缓冲池大小，防内存雪崩
      - --collation-server=utf8mb4_unicode_ci # 排序规则，必须设置，这里是大小写不敏感，基于标准的 Unicode 排序算法来进行比较
      - --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    restart: unless-stopped

